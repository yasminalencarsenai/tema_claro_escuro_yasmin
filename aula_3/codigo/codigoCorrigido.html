<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore o Mundo - Expedições</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="codigoCorrigido.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-asia"></i>
            <span>Explore o Mundo</span>
        </div>
        
        <div class="navegacao">
            <nav class="menu-links">
                <a href="">Início</a>
                <a href="">Destinos</a>
                <a href="">Sobre</a>
                <a href="">Contato</a>
            </nav>
            
            <div class="redes-sociais">
                <a href="#" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="#" class="face"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="insta"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>  

            <!-- Botao seletor de tema -->
            <button id="tema" class="btn-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header> 

    <section class="banner">
        <img src="https://images.unsplash.com/photo-1465056836041-7f43ac27dcb5?q=80&w=2071&auto=format&fit=crop" alt="Foto de montanha com nuvens" class="imagem">

        <div class="texto">
            <h1>Descubra o Inexplorável</h1>
            <p>Roteiros Exclusivos para quem ama aventura</p>
        </div>
    </section>

    <main class="container">
        <h2 class="titulo">Destinos em Destaque</h2>
        <p class="subtitulo">Conheça os melhores destinos para a temporada</p>
        <div class="foto">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&auto=format&fit=crop&q=80" alt="Mulher olhando para o vale" class="foto-1">
        </div>
        <p class="legenda">Expedição para Vale Profundo - Vagas Limitadas</p>
    </main>

    <footer class="rodape">
        <p>© 2026 Explore o Mundo - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
